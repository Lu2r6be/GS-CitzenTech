# ARQUIVO GERADO por security/ferramentas/gerar_regras_pii.py. NÃO edite à mão: rode o script de novo.
# Fontes: membros com [Pii(CategoriaPii.X)] em api/src. Veja security/regras/README.md.
rules:
  - id: pii-nome-para-log
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      Nome pode chegar a um log sem passar pelo PiiSanitizer.
      Troque por um identificador, use .Mascarado ou chame PiiSanitizer.Sanitizar antes.
    metadata:
      categoria: Nome
      exposicao: Log
      severidade: baixa
      cwe: CWE-532
      owasp: "API3:2023 Broken Object Property Level Authorization / A09:2021 Security Logging and Monitoring Failures"
    pattern-sources:
    - pattern: $X.Nome
    pattern-sanitizers:
    - pattern: $S.Sanitizar(...)
    - pattern: $X.Mascarado
    - pattern: Mascarar(...)
    pattern-sinks:
    - pattern: $L.LogTrace(...)
    - pattern: $L.LogDebug(...)
    - pattern: $L.LogInformation(...)
    - pattern: $L.LogWarning(...)
    - pattern: $L.LogError(...)
    - pattern: $L.LogCritical(...)
    - pattern: $L.Log(...)
    - pattern: Console.WriteLine(...)
    - pattern: Console.Write(...)
    - pattern: Console.Error.WriteLine(...)
